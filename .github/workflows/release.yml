name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The release body IS the CHANGELOG section for this version — a
      # release without a real description is incomplete (org standard).
      # The benchmark table is injected afterwards by
      # release-benchmark.yml, which listens for the released event.
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## (\\[)?(v)?"ver"([] ]|$)" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-body.md
          if ! [ -s release-body.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi
          # release-benchmark.yml injects the benchmark table between
          # these markers after publish — never paste numbers by hand.
          printf '\n<!-- benchmark-start -->\n<!-- benchmark-end -->\n' >> release-body.md

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          coverage: none

      # CycloneDX SBOM via the org's package-tools generator (§12.3). The
      # generator reads composer.lock from the app base path, which under
      # the testbench CLI is the skeleton — hence the copy.
      - name: Generate SBOM
        run: |
          composer update --prefer-dist --no-interaction --quiet
          cp composer.lock vendor/orchestra/testbench-core/laravel/composer.lock
          printf 'providers:\n  - Simtabi\\Laranail\\Validation\\ValidationServiceProvider\n  - Simtabi\\Laranail\\Package\\Tools\\Providers\\PackageToolsServiceProvider\n' > testbench.yaml
          vendor/bin/testbench laranail::package-tools.sbom --print > sbom.cdx.json
          php -r 'json_decode(file_get_contents("sbom.cdx.json"), flags: JSON_THROW_ON_ERROR);'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md \
            --generate-notes \
            sbom.cdx.json
