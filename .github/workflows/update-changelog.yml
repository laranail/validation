name: "Update Changelog"

on:
  release:
    types: [released]

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Always main: the CHANGELOG lives there, and a release in this repo
      # may legitimately TARGET a commit behind main (a patch tag cut from
      # a verified sha) — the release's target_commitish is then a bare
      # sha, which is not a branch anything can commit to. That is exactly
      # how the v0.1.1 run failed.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
