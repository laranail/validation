name: laravel-13-dev

# Nightly early-warning leg: runs the test suite against
# laravel/framework:13.x-dev + orchestra/testbench:*@dev to catch
# upstream breaking changes on the newest-supported Laravel major
# (rule-string parser, Validator::$customMessages, Rule::in/exists/unique
# shape) before they ship as tagged releases.
#
# Why 13.x and not dev-master:
# composer.json supports ^13 only. `dev-master` aliases to whatever the
# next major's dev branch is (currently 14.x), which we explicitly don't
# claim to support — running tests against it produces false-positive
# regression reports for unsupported versions. Pinning to the newest
# supported major keeps the signal-to-noise ratio honest.
#
# Testbench uses numbered dev branches; `*@dev` lets Composer pick the
# newest dev build that also satisfies our other constraints.
#
# On failure, upserts a single tracking issue titled "Laravel 13.x-dev
# regression" — created on the first fail, commented on subsequent fails.

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '51 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Silence forks — only run on the canonical repo.
    if: github.repository == 'laranail/validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: P8.5 - L-13.x-dev - testbench-newest-dev - ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      # The pin here is deliberate and must stay. Everywhere else in the family
      # a `composer require` before the suite is a defect -- it rewrites
      # composer.json so CI tests a manifest the package does not ship. This
      # workflow is the exception: its entire purpose is to resolve against the
      # unreleased Laravel branch, which no published constraint selects, so
      # without the pin it would quietly test stable and file issues about it.
      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies (13.x-dev)
        id: install
        run: |
          composer require "laravel/framework:13.x-dev" "orchestra/testbench:*@dev" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        id: tests
        run: vendor/bin/pest --ci

      - name: Look up existing tracking issue
        id: lookup
        if: always() && failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_number=$(gh issue list --state open --search 'in:title "Laravel 13.x-dev regression"' --json number --jq '.[0].number // empty')
          echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"

      - name: Compose failure body
        if: always() && failure()
        run: |
          cat > /tmp/regression-body.md <<EOF
          Nightly \`laravel/framework:13.x-dev\` run failed.

          - **Run:** <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>
          - **Matrix:** PHP 8.5 × laravel:13.x-dev × testbench:*@dev × prefer-stable × ubuntu-latest
          - **Commit:** ${{ github.sha }}
          - **Install outcome:** ${{ steps.install.outcome }}
          - **Test outcome:** ${{ steps.tests.outcome }}

          Failure mode — check the install step first: if \`composer require\` / \`composer update\` failed, the break is in dependency resolution (removed package, changed constraint, abandoned dep). Otherwise inspect the test step for runtime regressions: rule-string parser format, \`Validator::\$customMessages\` shape, \`Rule::in()\` / \`Rule::exists()\` / \`Rule::unique()\` return types.
          EOF

      - name: Create tracking issue
        if: always() && failure() && steps.lookup.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Laravel 13.x-dev regression" \
            --body-file /tmp/regression-body.md

      - name: Comment on existing issue
        if: always() && failure() && steps.lookup.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.lookup.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/regression-body.md
