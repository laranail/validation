name: Fix PHP code style issues

on:
  pull_request:
    paths:
      - '**.php'
      - 'pint.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      # NOT aglipanci/laravel-pint-action with `configPath: pint.json`. This
      # package ships no pint.json, and Pint handed a config path that does not
      # exist falls back to its OWN defaults and exits 0 rather than failing. So
      # this job was rewriting the code to Pint's defaults and committing that -
      # while `composer pint` checks the shared laranail config. The two
      # disagreed, and this one won because it pushes.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Fix PHP code style issues
        run: composer pint-fix

      - name: Pull latest changes
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git stash
          git pull --rebase origin "$BRANCH"
          git stash pop || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'chore: pint'
