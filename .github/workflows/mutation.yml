name: mutation

# Mutation testing is HOURS for the full compiler scope — each mutant
# re-runs the parity suites that cover it — so it guards on a weekly
# cadence and on demand, never per-commit, and fans out one job per
# compiler file: a single job proved uncancellable even at a 4-hour cap
# (1,112 mutants ≈ 6h serial), while per-file jobs run in parallel and
# the slowest file sets wall-clock. Pest's native mutation testing, not
# Infection: Infection 0.35 dropped its pest framework adapter.
#
# The floor is an audit bar, not a style gate: a file dropping under 60
# means the parity suites lost teeth for that compiler — the red IS the
# signal to add tests. FastCheckCompiler.php's verified baseline is
# 87.50% (two untested mutants on line 62, logged as a suite gap).
on:
  workflow_dispatch:
  schedule:
    - cron: "28 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest-mutate:
    runs-on: ubuntu-latest
    # 350: RuleConfigBuilder alone carries 634 mutants (over half the
    # compiler's surface) and missed a 240-minute cap by minutes; hosted
    # runners allow 6h.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        path:
          - src/FastCheckCompiler.php
          - src/FastCheck/CoreValueCompiler.php
          - src/FastCheck/ItemContextCompiler.php
          - src/FastCheck/PresenceConditionalCompiler.php
          - src/FastCheck/ProhibitedCompiler.php
          - src/FastCheck/RuleConfigBuilder.php
          - src/FastCheck/Shared/ItemAwareBranchBuilder.php
          - src/FastCheck/Shared/LaravelEmptiness.php

    name: mutate ${{ matrix.path }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          coverage: xdebug
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, intl

      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - run: composer update --prefer-dist --no-interaction

      - name: Mutate against the covering tests
        run: >
          vendor/bin/pest --mutate --covered-only --parallel
          --path=${{ matrix.path }} --min=60
        env:
          XDEBUG_MODE: coverage
