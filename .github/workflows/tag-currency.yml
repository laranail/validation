name: Tag currency

permissions:
  contents: read

# The check exists because this package has shipped a stale tag more than once.
# It had also been sitting in `scripts/` unwired, which is the same failure one
# level up: a check nobody runs is a check nobody has.
#
# On a schedule, because a tag can be moved or deleted directly on the remote,
# which no push to this repository would notice.
#
# NOT on pull_request, and that is the whole point. The tag falls behind at the
# moment a pull request MERGES -- so on the pull request itself the tag is
# always behind by exactly the commits under review, and the check fails for
# every green branch. It gated a condition that can only be satisfied after it
# has already run. The shared hygiene workflow in laranail/.github carries the
# same guard for the same reason.
on:
  schedule:
    # Monday 06:00 America/New_York, matching the Dependabot window. Cron has no
    # timezone, so this is 11:00 UTC and drifts an hour with DST — which does
    # not matter for a weekly check and is not worth a workaround.
    - cron: '37 11 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag-currency:
    name: tag currency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history and every tag. The default shallow checkout has
          # neither, and `git merge-base --is-ancestor` on a graph that stops at
          # one commit answers "not an ancestor" for tags that are perfectly
          # fine — the same false alarm that made the previous version of this
          # check unusable.
          fetch-depth: 0
          fetch-tags: true

      - name: Verify the tag consumers resolve is on main
        run: bash scripts/verify-tag-currency.sh main origin
