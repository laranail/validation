name: Benchmark

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**.php'
      - 'benchmark.php'
      - '.github/workflows/benchmark.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install base dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Generate baseline snapshot
        run: php benchmark.php --snapshot

      - name: Save baseline snapshot
        run: cp benchmark-snapshot.json ${{ runner.temp }}/benchmark-snapshot.json

      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Install PR dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Restore baseline snapshot
        run: cp ${{ runner.temp }}/benchmark-snapshot.json benchmark-snapshot.json

      - name: Run benchmark
        run: |
          echo "${{ github.event.pull_request.number }}" > benchmark-result.md
          php benchmark.php --ci >> benchmark-result.md

      - name: Upload benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-result
          path: benchmark-result.md
